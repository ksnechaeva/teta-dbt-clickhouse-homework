clickhouse_fraud_analytics:
  target: dev
  outputs:
    dev:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', '') }}"
      schema: "{{ env_var('CLICKHOUSE_DATABASE', 'analytics') }}"
      secure: "{{ env_var('CLICKHOUSE_SECURE', 'false') | lower == 'true' }}"
      verify: "{{ env_var('CLICKHOUSE_VERIFY', 'true') | lower == 'true' }}"
      connect_timeout: 10
      send_receive_timeout: 300
      threads: 4
