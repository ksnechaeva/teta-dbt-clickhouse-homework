name: clickhouse_fraud_analytics
version: '1.0.0'
config-version: 2

profile: clickhouse_fraud_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

require-dbt-version: [">=1.8.0", "<2.0.0"]

vars:
  "dbt_date:time_zone": "UTC"

models:
  clickhouse_fraud_analytics:
    staging:
      +materialized: view
      +tags: ["staging"]
    marts:
      +materialized: table
      +tags: ["marts"]

seeds:
  clickhouse_fraud_analytics:
    +schema: reference
    states:
      +column_types:
        state_code: String
        state_name: String
