version: 2

models:
  - name: mart_daily_state_metrics
    description: "Дневные метрики транзакций по штату. Grain: дата + штат."
    columns:
      - name: transaction_date
        description: "Дата транзакций."
        data_tests: [not_null]
      - name: us_state
        description: "Код штата."
        data_tests: [not_null]
      - name: transaction_count
        description: "Количество транзакций."
        data_tests: [not_null]
      - name: total_amount
        description: "Суммарный оборот."
      - name: average_amount
        description: "Средний чек."
      - name: p95_amount
        description: "Точный 95-й перцентиль суммы."
      - name: large_transaction_rate
        description: "Доля транзакций LARGE и VERY_LARGE, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [transaction_date, us_state]

  - name: mart_fraud_by_category
    description: "Уровень и объём фрода по категории. Grain: категория."
    columns:
      - name: cat_id
        description: "Категория транзакции."
        data_tests: [not_null, unique]
      - name: transaction_count
        description: "Общее число транзакций."
      - name: fraud_count
        description: "Число мошеннических транзакций."
      - name: fraud_rate
        description: "Доля мошеннических транзакций, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: total_amount
        description: "Сумма всех транзакций."
      - name: fraud_amount
        description: "Сумма мошеннических транзакций."

  - name: mart_fraud_by_state
    description: "Географический анализ фрода. Grain: штат."
    columns:
      - name: us_state
        description: "Код штата."
        data_tests: [not_null, unique]
      - name: transaction_count
        description: "Общее число транзакций."
      - name: fraud_count
        description: "Число фродов."
      - name: fraud_rate
        description: "Доля фрода, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: unique_customers
        description: "Уникальные клиенты."
      - name: unique_merchants
        description: "Уникальные мерчанты."
      - name: total_amount
        description: "Сумма всех транзакций."
      - name: fraud_amount
        description: "Сумма фродовых транзакций."

  - name: mart_customer_risk_profile
    description: "Профиль риска клиента с историей, чеком и сегментом HIGH/MEDIUM/LOW. Grain: клиент."
    columns:
      - name: customer_id
        description: "Surrogate key клиента."
        data_tests: [not_null, unique]
      - name: first_transaction_time
        description: "Первая известная транзакция."
      - name: last_transaction_time
        description: "Последняя известная транзакция."
      - name: transaction_count
        description: "Количество транзакций клиента."
      - name: fraud_count
        description: "Количество фродов клиента."
      - name: fraud_rate
        description: "Доля фрода клиента, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: average_amount
        description: "Средний чек клиента."
      - name: risk_level
        description: "Риск: HIGH, MEDIUM или LOW."
        data_tests:
          - accepted_values:
              values: ['HIGH', 'MEDIUM', 'LOW']

  - name: mart_hourly_fraud_pattern
    description: "Почасовые паттерны по дням недели. Grain: день недели + час."
    columns:
      - name: day_of_week_number
        description: "Номер дня недели."
        data_tests: [not_null]
      - name: transaction_hour
        description: "Час суток."
        data_tests: [not_null]
      - name: fraud_rate
        description: "Доля фрода, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: is_high_risk_window
        description: "Флаг временного окна с fraud_rate >= 10%."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [day_of_week_number, transaction_hour]

  - name: mart_merchant_analytics
    description: "Оборот и риск каждого мерчанта. Grain: мерчант."
    columns:
      - name: merch
        description: "Мерчант."
        data_tests: [not_null, unique]
      - name: transaction_count
        description: "Количество транзакций."
      - name: unique_customers
        description: "Количество уникальных клиентов."
      - name: fraud_count
        description: "Количество фродов."
      - name: fraud_rate
        description: "Доля фрода, %."
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100
      - name: turnover
        description: "Оборот мерчанта."
      - name: is_suspicious
        description: "Флаг: fraud_rate >= 10% при пяти и более транзакциях."

unit_tests:
  - name: test_fraud_by_category_aggregation
    description: "Проверяет расчёт fraud_rate и сумм по категории."
    model: mart_fraud_by_category
    given:
      - input: ref('stg_transactions')
        rows:
          - customer_id: c1
            transaction_time: '2026-01-05 10:00:00'
            transaction_date: '2026-01-05'
            transaction_hour: 10
            day_of_week_number: 1
            day_of_week_name: Monday
            merch: Market
            cat_id: groceries
            amount: 100.0
            amount_bucket: MEDIUM
            name_1: Ada
            name_2: Lovelace
            gender: F
            us_state: CA
            lat: 34.0
            lon: -118.0
            merchant_lat: 34.1
            merchant_lon: -118.1
            target: 0
            is_fraud: false
          - customer_id: c2
            transaction_time: '2026-01-05 11:00:00'
            transaction_date: '2026-01-05'
            transaction_hour: 11
            day_of_week_number: 1
            day_of_week_name: Monday
            merch: Market
            cat_id: groceries
            amount: 300.0
            amount_bucket: LARGE
            name_1: Grace
            name_2: Hopper
            gender: F
            us_state: NY
            lat: 40.0
            lon: -74.0
            merchant_lat: 40.1
            merchant_lon: -74.1
            target: 1
            is_fraud: true
    expect:
      rows:
        - {cat_id: groceries, transaction_count: 2, fraud_count: 1, fraud_rate: 50.0, total_amount: 400.0, fraud_amount: 300.0}

  - name: test_customer_risk_high
    description: "Три фрода переводят клиента в HIGH даже при любой доле."
    model: mart_customer_risk_profile
    given:
      - input: ref('stg_transactions')
        rows:
          - customer_id: c1
            transaction_time: '2026-01-01 10:00:00'
            transaction_date: '2026-01-01'
            transaction_hour: 10
            day_of_week_number: 4
            day_of_week_name: Thursday
            merch: Shop
            cat_id: shopping
            amount: 10.0
            amount_bucket: SMALL
            name_1: Ada
            name_2: Lovelace
            gender: F
            us_state: CA
            lat: 34.0
            lon: -118.0
            merchant_lat: 34.1
            merchant_lon: -118.1
            target: 1
            is_fraud: true
          - customer_id: c1
            transaction_time: '2026-01-02 10:00:00'
            transaction_date: '2026-01-02'
            transaction_hour: 10
            day_of_week_number: 5
            day_of_week_name: Friday
            merch: Shop
            cat_id: shopping
            amount: 20.0
            amount_bucket: SMALL
            name_1: Ada
            name_2: Lovelace
            gender: F
            us_state: CA
            lat: 34.0
            lon: -118.0
            merchant_lat: 34.1
            merchant_lon: -118.1
            target: 1
            is_fraud: true
          - customer_id: c1
            transaction_time: '2026-01-03 10:00:00'
            transaction_date: '2026-01-03'
            transaction_hour: 10
            day_of_week_number: 6
            day_of_week_name: Saturday
            merch: Shop
            cat_id: shopping
            amount: 30.0
            amount_bucket: SMALL
            name_1: Ada
            name_2: Lovelace
            gender: F
            us_state: CA
            lat: 34.0
            lon: -118.0
            merchant_lat: 34.1
            merchant_lon: -118.1
            target: 1
            is_fraud: true
    expect:
      rows:
        - {customer_id: c1, transaction_count: 3, fraud_count: 3, fraud_rate: 100.0, total_amount: 60.0, average_amount: 20.0, risk_level: HIGH}
